<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f7a8c4" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Bubu &amp; Dudu zwiedzają Japonię</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- NAWIGACJA (widoczna poza ekranem startowym) -->
  <nav id="nav" class="nav hidden">
    <button class="nav-btn" data-view="calendar" id="navCalendar">📅 Kalendarz</button>
    <button class="nav-btn" data-view="timeline" id="navTimeline">📆 Dzień po dniu</button>
    <button class="nav-btn" data-view="attractions" id="navAttractions">🗺️ Atrakcje</button>
    <button class="nav-btn" data-view="logistics" id="navLogistics">🧳 Podróż</button>
    <button class="nav-btn" data-view="wallet" id="navWallet">💴 Portfel</button>
    <!-- ZALOGOWANY UŻYTKOWNIK (klik = zmiana użytkownika) -->
    <button id="userBadge" class="user-badge hidden"></button>
  </nav>

  <!-- OSTRZEŻENIE, GDY PRZEGLĄDARKA NIE ZAPISUJE DANYCH -->
  <div id="storageWarn" class="storage-warn hidden"></div>

  <!-- WIDOK: OKŁADKA -->
  <section id="view-cover" class="view view-cover">
    <div class="cover-bg" style="background-image: url('assets/cover.jpg');"></div>
    <div class="cover-overlay"></div>
    <div class="cover-content">
      <h1 id="tripTitle" class="cover-title"></h1>
      <p id="tripSubtitle" class="cover-subtitle"></p>
      <p class="login-label">Kto zwiedza?</p>
      <div id="loginPanel" class="login-panel"></div>
      <button id="startBtn" class="btn-start" disabled>Zwiedzamy! 🎒</button>
    </div>
  </section>

  <!-- WIDOK: DZIEŃ PO DNIU -->
  <section id="view-timeline" class="view hidden">
    <div id="timelineDays" class="timeline-days"></div>
  </section>

  <!-- WIDOK: KALENDARZ -->
  <section id="view-calendar" class="view hidden">
    <div id="calendarMonths" class="calendar-months"></div>
  </section>

  <!-- WIDOK: ATRAKCJE -->
  <section id="view-attractions" class="view hidden">
    <div class="filters">
      <div class="filters-top">
        <input id="searchInput" class="search-input" type="search" placeholder="Szukaj atrakcji…" autocomplete="off" />
        <button id="mapToggleBtn" class="add-btn ghost" type="button" aria-label="Pokaż mapę">🗺️</button>
        <button id="addAttractionBtn" class="add-btn" type="button">+ Dodaj</button>
      </div>
      <div id="cityChips" class="chips"></div>
      <div id="categoryChips" class="chips"></div>
      <div id="statusChips" class="chips">
        <button class="chip active" data-status="all">Wszystkie</button>
        <button class="chip" data-status="nodate">Bez daty</button>
        <button class="chip" data-status="planned">Zaplanowane</button>
        <button class="chip" data-status="visited">Zwiedzone</button>
      </div>
      <div class="progress">
        <p id="progressLabel" class="progress-label"></p>
        <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
      </div>
    </div>
    <div id="attractionsMap" class="map-view hidden"></div>
    <div id="attractionsList" class="attractions-list"></div>
  </section>

  <!-- WIDOK: PODRÓŻ (loty, pociągi, noclegi, auto, bilety) -->
  <section id="view-logistics" class="view hidden">
    <div id="logisticsChips" class="chips"></div>
    <div id="logisticsList"></div>
  </section>

  <!-- WIDOK: PORTFEL (stan gotówki i karty, wydatki, bilans) -->
  <section id="view-wallet" class="view hidden">
    <div id="walletPanel"></div>
  </section>

  <!-- SZCZEGÓŁY ATRAKCJI (po kliknięciu w kartę) -->
  <div id="detailModal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button id="modalClose" class="modal-close" aria-label="Zamknij">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
